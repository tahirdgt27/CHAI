<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chai Pila Rahay Ho?</title>
    <script src="https://unpkg.com/@tailwindcss/browser@4"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;900&display=swap');
        
        body {
            font-family: 'Inter', sans-serif;
            margin: 0;
            overflow: hidden;
            background-color: #FF6321;
        }

        .success-screen {
            display: none;
        }

        .is-accepted .question-screen {
            display: none;
        }

        .is-accepted .success-screen {
            display: flex;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-20px) rotate(5deg); }
        }

        .floating-icon {
            animation: float 4s ease-in-out infinite;
        }

        .no-button {
            transition: all 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
    </style>
</head>
<body class="bg-[#FF6321] min-h-screen flex items-center justify-center">

    <!-- Background Icons -->
    <div class="absolute inset-0 pointer-events-none opacity-10 overflow-hidden" id="background-icons">
        <!-- Icons will be injected here -->
    </div>

    <div id="main-container" class="relative z-10 w-full max-w-2xl px-4 text-center">
        
        <!-- Question Screen -->
        <div class="question-screen flex flex-col items-center">
            <div class="mb-8 floating-icon">
                <i data-lucide="coffee" class="w-20 h-20 text-black"></i>
            </div>
            
            <h1 class="text-5xl md:text-7xl font-black text-black uppercase tracking-tighter leading-none mb-12">
                CHAI PILA <br> RAHAY HO?
            </h1>

            <div class="flex flex-col sm:flex-row items-center justify-center gap-6 sm:gap-12 min-h-[100px] w-full relative">
                <button 
                    onclick="handleYes()"
                    class="px-12 py-4 bg-black text-[#FF6321] text-2xl font-bold rounded-full shadow-2xl hover:scale-110 active:scale-95 transition-transform cursor-pointer z-20"
                >
                    YES!
                </button>

                <button 
                    id="no-btn"
                    onmouseenter="moveNoButton()"
                    ontouchstart="moveNoButton()"
                    class="no-button px-12 py-4 border-4 border-black text-black text-2xl font-bold rounded-full cursor-default z-20"
                >
                    NO
                </button>
            </div>
        </div>

        <!-- Success Screen -->
        <div class="success-screen flex flex-col items-center animate-in zoom-in duration-500">
            <div class="mb-6 animate-bounce">
                <i data-lucide="party-popper" class="w-24 h-24 text-black"></i>
            </div>
            
            <h2 class="text-6xl md:text-8xl font-black text-black uppercase tracking-tighter leading-none mb-4">
                SHUKRIYA!
            </h2>
            <p class="text-2xl font-bold text-black/80 uppercase tracking-widest">
                I'm coming for the chai! ☕️
            </p>

            <div class="mt-12 flex gap-4">
                <i data-lucide="heart" class="w-8 h-8 text-black fill-black"></i>
                <i data-lucide="heart" class="w-8 h-8 text-black fill-black"></i>
                <i data-lucide="heart" class="w-8 h-8 text-black fill-black"></i>
                <i data-lucide="heart" class="w-8 h-8 text-black fill-black"></i>
                <i data-lucide="heart" class="w-8 h-8 text-black fill-black"></i>
            </div>

            <button 
                onclick="reset()"
                class="mt-16 text-black/60 hover:text-black font-bold uppercase tracking-tighter text-sm underline underline-offset-4"
            >
                Ask again?
            </button>
        </div>
    </div>

    <audio id="success-audio" src="https://assets.mixkit.co/active_storage/sfx/2568/2568-preview.mp3"></audio>

    <script>
        // Initialize Lucide Icons
        lucide.createIcons();

        const noBtn = document.getElementById('no-btn');
        const container = document.body;
        const mainContainer = document.getElementById('main-container');

        function moveNoButton() {
            const btnWidth = noBtn.offsetWidth;
            const btnHeight = noBtn.offsetHeight;
            
            // Calculate random position within the viewport
            // Subtracting button size to keep it on screen
            const maxX = window.innerWidth - btnWidth - 40;
            const maxY = window.innerHeight - btnHeight - 40;
            
            const newX = Math.random() * maxX;
            const newY = Math.random() * maxY;

            noBtn.style.position = 'fixed';
            noBtn.style.left = newX + 'px';
            noBtn.style.top = newY + 'px';
        }

        function handleYes() {
            document.body.classList.add('is-accepted');
            const audio = document.getElementById('success-audio');
            audio.play().catch(e => console.log("Audio play blocked by browser"));
        }

        function reset() {
            document.body.classList.remove('is-accepted');
            noBtn.style.position = 'static';
            noBtn.style.left = 'auto';
            noBtn.style.top = 'auto';
        }

        // Inject background icons
        const bgContainer = document.getElementById('background-icons');
        for (let i = 0; i < 15; i++) {
            const div = document.createElement('div');
            div.className = 'absolute text-black/5';
            div.style.left = Math.random() * 100 + '%';
            div.style.top = Math.random() * 100 + '%';
            div.style.transform = `rotate(${Math.random() * 360}deg)`;
            div.innerHTML = '<i data-lucide="coffee" style="width: ' + (Math.random() * 40 + 40) + 'px; height: ' + (Math.random() * 40 + 40) + 'px;"></i>';
            bgContainer.appendChild(div);
        }
        lucide.createIcons();
    </script>
</body>
</html>
